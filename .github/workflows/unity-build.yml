name: Unity CI (Simple Build)
on:
  push:
    branches: [ main ]  # only run on the main branch
  pull_request:
    branches: [ main ]  # when you open a PR to main
jobs:
  build:
    runs-on: ubuntu-latest  # run on the latest Ubuntu image
    steps:
    - name: Checkout project
      uses: actions/checkout@v3  # pulls your repo's code
    - name: Build Unity project
      uses: game-ci/unity-builder@v2  # the Unity builder action
      with:
        unityVersion: 6000.0.34f1  # your actual Unity version
        targetPlatform: WebGL  # change to Android, or StandaloneWindows64 if needed
      env:
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}  # reference GitHub secrets
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}