name: Unity Project Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check Unity Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: List repository contents
        run: |
          echo "Listing repository contents"
          ls -la
          
      - name: Check Unity project structure
        run: |
          echo "Checking Unity project structure"
          
          # Check if basic Unity directories exist
          for dir in Assets ProjectSettings Packages; do
            if [ -d "$dir" ]; then
              echo "[PASS] $dir directory exists"
            else
              echo "[INFO] $dir directory missing"
              # Creating directory for future workflow expansion
              mkdir -p "$dir"
            fi
          done
          
          echo "Basic project check completed"
