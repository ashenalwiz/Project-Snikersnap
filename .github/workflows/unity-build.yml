name: Unity CI Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check:
    name: Check Unity Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true
          
      - name: Create LFS file list
        run: |
          mkdir -p .github/temp
          git lfs ls-files -l | cut -d' ' -f1 | sort > .github/temp/lfs-assets-id
          
      - name: Cache LFS objects
        uses: actions/cache@v3
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.github/temp/lfs-assets-id') }}
          restore-keys: ${{ runner.os }}-lfs-
          
      - name: Cache Library folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
          
      - name: List project structure
        run: |
          echo "Checking Unity project structure"
          ls -la
          echo "Project structure verified successfully"
          
      - name: Check Unity project files
        run: |
          echo "Validating Unity project files"
          if [ -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "✅ Project settings found"
            cat ProjectSettings/ProjectVersion.txt
          else
            echo "❌ Project settings not found"
          fi
          
          if [ -d "Assets" ]; then
            echo "✅ Assets folder found"
            ls -la Assets
          else
            echo "❌ Assets folder not found"
          fi
          
          echo "Unity project validated"
