name: Unity Project CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Unity Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Basic validation
        run: |
          echo "Running basic Unity project validation"
          
          # Create a validation report
          echo "Validation Report" > validation-report.txt
          echo "==================" >> validation-report.txt
          echo "Date: $(date)" >> validation-report.txt
          echo "Repository: $GITHUB_REPOSITORY" >> validation-report.txt
          echo "Branch: $GITHUB_REF_NAME" >> validation-report.txt
          echo "Commit: $GITHUB_SHA" >> validation-report.txt
          
          # Check if project directories exist
          echo -e "\nProject Structure:" >> validation-report.txt
          for dir in Assets ProjectSettings Packages; do
            if [ -d "$dir" ]; then
              echo "- $dir: EXISTS" >> validation-report.txt
            else
              echo "- $dir: MISSING (created placeholder)" >> validation-report.txt
              mkdir -p "$dir"
              touch "$dir/.placeholder"
            fi
          done
          
          # Verify the report exists
          ls -la validation-report.txt
          
          echo "Validation complete"
      
      - name: Upload validation report
        uses: actions/upload-artifact@v3
        with:
          name: validation-report
          path: validation-report.txt
          retention-days: 7
