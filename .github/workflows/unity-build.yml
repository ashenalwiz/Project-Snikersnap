name: Unity 6 CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Clean working directory
        run: |
          git clean -xfd
          git reset --hard

      - name: Create LFS file list
        run: |
          mkdir -p .github/temp
          git lfs ls-files -l | cut -d' ' -f1 | sort > .github/temp/lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v3
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.github/temp/lfs-assets-id') }}
          restore-keys: ${{ runner.os }}-lfs-

      - name: Cache Library folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Build with Unity (6000.0.34f1 version)
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 6000.0.34f1
          targetPlatform: Android
          allowDirtyBuild: true
        continue-on-error: true 

      - name: Capture Unity Logs
        if: failure()
        run: |
          echo "Build failed. Capturing Unity logs for debugging."
          tail -n 20 /opt/Unity/Editor/Data/Unity.log # Adjust the path to your Unity installation directory.
