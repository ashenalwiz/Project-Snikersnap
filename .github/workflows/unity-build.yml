name: Unity 6 CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Clean working directory
        run: |
          git clean -xfd
          git reset --hard

      - name: Create LFS file list
        run: |
          mkdir -p .github/temp
          git lfs ls-files -l | cut -d' ' -f1 | sort > .github/temp/lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v3
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.github/temp/lfs-assets-id') }}
          restore-keys: ${{ runner.os }}-lfs-

      - name: Cache Library folder
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Install Unity License (for CI builds)
        run: |
          echo "Installing Unity License"
          curl -sSL https://download.unity3d.com/download_unity/9e8f7b3d02e9/UnitySetup-2020.3.40f1.exe -o UnitySetup.exe
          chmod +x UnitySetup.exe
          ./UnitySetup.exe --unattended --install-location /opt/Unity

      - name: Build with Unity
        uses: game-ci/unity-builder@v2
        with:
          unityVersion: 2020.3.40f1
          targetPlatform: Android
          allowDirtyBuild: true
