name: Unity CI (No License Needed)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Cache Unity packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/unity3d
          ~/.local/share/unity3d
        key: ${{ runner.os }}-unity-cache

    - name: Set up Unity Builder
      uses: game-ci/unity-builder@v2
      with:
        unityVersion: 2022.3.0f1
        targetPlatform: StandaloneWindows64  # Change to Android/WebGL if needed

