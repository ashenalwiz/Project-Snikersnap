name: Unity Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Unity
        uses: game-ci/unity-setup@v3
        with:
          unityVersion: 6000.0.34f1  # Change this to your installed Unity version

      - name: Build Unity Project
        run: |
          mkdir -p Build
          unity-editor -quit -batchmode -nographics -logfile -buildTarget StandaloneWindows64 -projectPath . -executeMethod BuildScript.Build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: UnityBuild
          path: Build/
