name: Unity CI - No License

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Cache Unity packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.npm
          ~/.cache/unity3d
          ~/.local/share/unity3d
        key: ${{ runner.os }}-unity-cache

    - name: Set up Unity
      uses: game-ci/unity-actions/setup@v2
      with:
        unityVersion: 2022.3.0f1

    - name: Build project
      uses: game-ci/unity-actions/build@v2
      with:
        targetPlatform: StandaloneWindows64
