name: Unity Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Unity
        uses: game-ci/unity-setup@v2  # Fix: Use v2 instead of v3
        with:
          unityVersion: 2022.3.5f1  # Change this to your Unity version

      - name: Build Unity Project
        run: |
          mkdir -p Build
          unity-editor -quit -batchmode -nographics -logfile -buildTarget StandaloneWindows64 -projectPath . -executeMethod BuildScript.Build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: UnityBuild
          path: Build/
